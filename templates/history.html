<!DOCTYPE html>
<html>
<head><title>Recommendation History - PocketSmart AI</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
    <div class="navbar">
        <h1>PocketSmart AI</h1>
        <div><a href="/dashboard">Dashboard</a><a href="/history">History</a><a href="#" onclick="logout()">Logout</a></div>
    </div>
    <div class="container">
        <div class="card">
            <h2>Your Recommendation History</h2>
            <div id="historyList">Loading previous queries...</div>
        </div>
    </div>
    <script>
        async function loadHistory() {
            const user = localStorage.getItem("user") || "Guest";
            const res = await fetch(`/api/history?username=${user}`);
            const data = await res.json();
            let html = "";
            if(!data || data.length === 0) {
                html = "<p style='color:#64748b;'>No recommendation history found.</p>";
            } else {
                data.forEach(row => {
                    html += `<div class="history-item">
                        <span class="badge">${row.module}</span>
                        <h3 style="margin-top:8px; color:#1e3a8a;">Budget: ₹${row.budget}</h3>
                        <p style="font-size:14px; color:#475569; margin-top:5px;">${row.details}</p>
                    </div>`;
                });
            }
            document.getElementById("historyList").innerHTML = html;
        }
        loadHistory();
        function logout() { localStorage.removeItem("user"); window.location.href = "/login"; }
    </script>
</body>
</html>
