<!DOCTYPE html>
<html>
<head><title>Login - PocketSmart AI</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
    <div class="navbar"><h1>PocketSmart AI</h1><a href="/">Home</a></div>
    <div class="container" style="max-width: 420px;">
        <div class="card">
            <h2 style="text-align: center;">Welcome Back</h2>
            <form action="/login" method="post">
                <label>Username</label><input type="text" name="username" required>
                <label>Password</label><input type="password" name="password" required>
                <button type="submit" style="width: 100%;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 14px;">Don't have an account? <a href="/register" style="color: #2563eb;">Register here</a></p>
        </div>
    </div>
</body>
</html>
